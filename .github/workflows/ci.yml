name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Assumption: macos-26 (Apple silicon) is the newest hosted runner with Xcode 26+.
    # The project targets Xcode 27.2 locally; the step below selects the newest Xcode
    # installed on the runner, so bump the label when a newer image appears.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version

      - name: Verify (Mac)
        run: scripts/verify.sh --only mac

  build-test-ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"
          xcodebuild -version

      # The simulator is picked by UDID from `simctl list devices available` (iPhone 17 Pro if present).
      - name: Verify (iOS)
        run: scripts/verify.sh --only ios

  ios-ui-tests:
    # The iOS unit tests and XCUITests on one iPhone Simulator (picked by UDID: iPhone 17 Pro if present, else the newest
    # iPhone). Fixtures are generated clips added to the Simulator's own Photos library; nobody's media is involved.
    # The performance tests are not run here (they need a quiet machine; see PERFORMANCE.md).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: UI tests (iPhone)
        run: scripts/ios-ui-tests.sh

      - name: Upload the result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test-results
          path: .build/ios-ui/results
          if-no-files-found: ignore

  sanitizers:
    # Thread and address sanitizer runs of the package tests, one job each.
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"

      - name: Test Core (${{ matrix.sanitizer }} sanitizer)
        working-directory: Packages/Core
        run: swift test --sanitize=${{ matrix.sanitizer }}

      - name: Test Convert (${{ matrix.sanitizer }} sanitizer)
        working-directory: Packages/Tools/Convert
        run: swift test --sanitize=${{ matrix.sanitizer }}

  performance-report:
    # A report only: it runs the 4K downscale benchmark in a Release build, prints the numbers and uploads them as
    # a JSON artifact. It enforces nothing. The stored baselines are for the release Mac (keyed by hardware model),
    # and hosted runners vary too much to hold a 20 % rule; the check is done locally before each release
    # (docs/RELEASING.md).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"

      - name: Measure
        working-directory: Packages/Core
        env:
          RUN_PERF_TESTS: "1"
          PERF_REPORT_PATH: ${{ runner.temp }}/perf-report.json
        run: swift test -c release -Xswiftc -enable-testing --filter PerformanceTests

      - name: Upload the numbers
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: ${{ runner.temp }}/perf-report.json
