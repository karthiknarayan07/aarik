name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Assumption: macos-26 (Apple silicon) is the newest hosted runner with Xcode 26+.
    # The project targets Xcode 27.2 locally; the step below selects the newest Xcode
    # installed on the runner, so bump the label when a newer image appears.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version

      - name: Lint
        run: swift format lint --recursive --strict Packages/AppModules/Sources Packages/AppModules/Tests App/Sources

      - name: Build packages
        working-directory: Packages/AppModules
        run: swift build -Xswiftc -warnings-as-errors --build-tests

      - name: Test packages
        working-directory: Packages/AppModules
        run: swift test

      - name: Build app (Release)
        run: |
          xcodebuild -project App/App.xcodeproj -scheme App -configuration Release \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO build

  sanitizers:
    # Thread and address sanitizer runs of the package tests, one job each.
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"

      - name: Test (${{ matrix.sanitizer }} sanitizer)
        working-directory: Packages/AppModules
        run: swift test --sanitize=${{ matrix.sanitizer }}

  performance:
    # Times and memory of a generated 4K downscale, compared with the stored baseline (20 % rule). Off in the other
    # jobs: RUN_PERF_TESTS is unset there, so the benchmark skips itself. A runner with no stored baseline (the
    # baselines are per hardware model) measures and prints instead of failing.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [[ -z "$newest" ]]; then
            echo "No versioned Xcode found under /Applications" >&2
            exit 1
          fi
          sudo xcode-select -s "$newest"

      - name: Performance tests
        working-directory: Packages/AppModules
        env:
          RUN_PERF_TESTS: "1"
        run: swift test --filter PerformanceTests
